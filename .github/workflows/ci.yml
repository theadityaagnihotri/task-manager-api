name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/task-manager:${{ github.sha }} .

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/task-manager:${{ github.sha }}
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL

      - name: Push image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/task-manager:${{ github.sha }}
      
      - name: Update GitOps repository
        run: |
          git clone https://x-access-token:${{ secrets.GITOPS_PAT }}@github.com/theadityaagnihotri/task-manager-gitops.git gitops-repo
          cd gitops-repo/task-manager

          sed -i "s/tag: .*/tag: \"${{ github.sha }}\"/" values.yaml

          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"

          git add values.yaml
          git diff --staged --quiet && echo "No changes to commit" && exit 0

          git commit -m "ci: update image tag to ${{ github.sha }} [skip ci]"
          git push
